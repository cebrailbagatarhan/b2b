name: Offline catalog audit tests
on:
  push:
    paths:
      - 'scripts/catalog_audit.py'
      - 'tests/test_catalog_audit.py'
      - '.github/workflows/catalog-audit.yml'
  pull_request:
    paths:
      - 'scripts/catalog_audit.py'
      - 'tests/test_catalog_audit.py'
      - '.github/workflows/catalog-audit.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_catalog_audit.py' -v
      - run: python -m py_compile scripts/catalog_audit.py tests/test_catalog_audit.py
