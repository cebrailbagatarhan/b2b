name: FAQ disclosure regression

on:
  pull_request:
    paths:
      - 'src/app/sss/page.tsx'
      - 'src/lib/faq.ts'
      - 'tests/faq.test.ts'
      - '.github/workflows/faq-check.yml'

permissions:
  contents: read

jobs:
  faq-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run FAQ regression tests without installing dependencies
        run: node --experimental-strip-types --test tests/faq.test.ts
